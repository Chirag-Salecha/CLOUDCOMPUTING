apiVersion: apps/v1
kind: Deployment
metadata:
  name: preferred-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: preferred-web

  template:
    metadata:
      labels:
        app: preferred-web

    spec:
      nodeSelector:
        pool: worker

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: disktype
                    operator: In
                    values:
                      - ssd

      containers:
        - name: nginx
          image: nginx:stable-alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"