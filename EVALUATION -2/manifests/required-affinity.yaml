apiVersion: apps/v1
kind: Deployment
metadata:
  name: required-web
  labels:
    app: required-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: required-web

  template:
    metadata:
      labels:
        app: required-web

    spec:
      nodeSelector:
        pool: worker

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: disktype
                    operator: In
                    values:
                      - ssd

      containers:
        - name: nginx
          image: nginx:stable-alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service

metadata:
  name: required-web-service

spec:
  selector:
    app: required-web

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP